name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when release-please actually cut a release on this push (i.e. the
  # auto-maintained "Release PR" - which accumulates pending Conventional Commits
  # into a version bump + CHANGELOG.md entry - was just merged). Every other push to
  # main only updates/refreshes that PR and stops after the job above.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required to fetch the OIDC token azure/login exchanges for a Marketplace publishing credential - no PAT stored anywhere.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Quality gate (same checks as CI, re-run against the exact tagged commit)
        run: |
          pnpm run lint
          pnpm run format:check
          pnpm run compile
          pnpm test

      # See docs/RELEASE_SETUP.md for the one-time Microsoft Entra ID / Marketplace
      # publisher setup this depends on (App Registration, federated credential
      # trusting this repo, publisher authorization) - none of it can be done from
      # this workflow, it's a manual portal setup performed once by a maintainer.
      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Package .vsix
        env:
          COREPACK_ENABLE_STRICT: '0'
        run: pnpm exec vsce package -o facturx-vscode.vsix

      - name: Publish to the VS Code Marketplace
        env:
          COREPACK_ENABLE_STRICT: '0'
        run: pnpm exec vsce publish --azure-credential --packagePath facturx-vscode.vsix

      - name: Attach the .vsix to the GitHub release
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" facturx-vscode.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
