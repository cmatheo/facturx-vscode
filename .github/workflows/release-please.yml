name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when release-please actually cut a release on this push (i.e. the
  # auto-maintained "Release PR" - which accumulates pending Conventional Commits
  # into a version bump + CHANGELOG.md entry - was just merged). Every other push to
  # main only updates/refreshes that PR and stops after the job above.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Must match the GitHub Environment name the federated credential trusts (see
    # docs/RELEASE_SETUP.md) - an Environment-scoped credential, rather than a
    # branch-scoped one, is what Microsoft's own OIDC subject claim is checked
    # against here, and lets you optionally require a manual approval before a
    # publish runs by adding a protection rule to this environment later.
    environment: marketplace-publish
    permissions:
      contents: write
      id-token: write # required to fetch the OIDC token azure/login exchanges for a Marketplace publishing credential - no PAT stored anywhere.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Quality gate (same checks as CI, re-run against the exact tagged commit)
        run: |
          pnpm run lint
          pnpm run format:check
          pnpm run compile
          pnpm test

      # See docs/RELEASE_SETUP.md for the one-time Microsoft Entra ID / Marketplace
      # publisher setup this depends on (App Registration, federated credential
      # trusting this repo, publisher authorization) - none of it can be done from
      # this workflow, it's a manual portal setup performed once by a maintainer.
      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Smoke-test the esbuild bundle (activate/deactivate under a fake vscode module)
        run: pnpm run smoke

      - name: Package .vsix
        run: pnpm run package

      - name: Publish to the VS Code Marketplace
        run: pnpm exec vsce publish --azure-credential --skip-duplicate --packagePath facturx-vscode.vsix

      - name: Attach the .vsix to the GitHub release
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" facturx-vscode.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
