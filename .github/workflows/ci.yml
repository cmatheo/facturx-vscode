name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Type-check / compile
        run: pnpm run compile

      - name: Test
        run: pnpm test

      - name: Smoke-test the esbuild bundle (activate/deactivate under a fake vscode module)
        run: pnpm run smoke

      - name: Package the extension (build-only check, not published)
        # pnpm run package bundles with esbuild, packages with `vsce package
        # --no-dependencies` (COREPACK_ENABLE_STRICT=0 lets vsce's inner npm-shelled
        # prepublish step run despite this repo pinning pnpm), then vendors in the
        # handful of runtime files (xmllint-wasm, pdfjs-dist's browser build) vsce's
        # own dependency detection can't be made to trim reliably - see
        # scripts/package-vsix.js.
        run: pnpm run package
